name: build
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  ios:
    runs-on: macos-14
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: ANGLE cache
        uses: actions/cache@v4
        with:
          path: angle_ios
          key: angle-ios-${{ hashFiles('scripts/angle_derle.sh') }}
      - name: Build
        shell: bash
        run: |
          set -o pipefail
          bash scripts/derle.sh 2>&1 | tee derleme.log
      - name: Error summary
        if: failure()
        shell: bash
        run: |
          python3 - <<'PY'
          lines = open('derleme.log', errors='replace').read().splitlines()
          tail = chr(10).join(l[:300] for l in lines[-80:])
          tail = tail.replace('%', '%25').replace(chr(13), '').replace(chr(10), '%0A')
          print('::error title=build tail::' + tail)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: AngleIOSTest
          path: cikti/
